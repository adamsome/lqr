name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders: the build only needs these to be defined, it never
      # connects to Mongo or sends email.
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
